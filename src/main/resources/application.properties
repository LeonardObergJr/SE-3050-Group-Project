spring.application.name=demo
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/market_management
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=Aarish_Khan
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Sample data is loaded by SampleDataInitializer only when the database is empty.
spring.sql.init.data-locations=optional:classpath:disabled-data-init.sql

spring.jpa.defer-datasource-initialization=true

spring.mvc.hiddenmethod.filter.enabled=true