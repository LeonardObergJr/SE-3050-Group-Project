<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Market Details | Farmers Market Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<!-- HEADER -->

<header class="navbar">

    <div class="logo">

        <span class="logo-icon">🌱</span>

        Farmers Market Hub

    </div>


    <nav>

        <a href="index.html">
            Markets
        </a>

        <a href="index.html#products">
            Products
        </a>

    </nav>

</header>


<!-- MAIN -->

<main class="market-page">

    <div class="page-container">


        <a
            href="index.html"
            class="back-link">

            ← Back to Markets

        </a>


        <!-- MARKET INFORMATION -->

        <section
            id="marketDetails"
            class="market-detail-card">

            <!-- JavaScript loads market -->

        </section>


        <!-- VENDORS -->

        <section class="vendors-section">

            <div class="section-heading">

                <div>

                    <span class="section-label">
                        OUR COMMUNITY
                    </span>

                    <h2>
                        Market Vendors
                    </h2>

                </div>

                <p>
                    Meet the local vendors
                    participating in this market.
                </p>

            </div>


            <div
                id="vendorContainer"
                class="vendor-grid">

                <!-- JavaScript loads vendors -->

            </div>

        </section>

    </div>

</main>


<!-- FOOTER -->

<footer>

    <div class="footer-content">

        <div>

            <div class="logo footer-logo">

                <span class="logo-icon">🌱</span>

                Farmers Market Hub

            </div>

            <p>
                Supporting local farmers
                and communities.
            </p>

        </div>

    </div>


    <div class="footer-bottom">

        © 2026 Farmers Market Hub.
        All rights reserved.

    </div>

</footer>


<script src="js/market.js"></script>

</body>

</html>
